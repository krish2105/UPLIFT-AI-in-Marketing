# Curated seed for the Dubai events dataset.
#
# WHY THIS IS CURATED AND SAYS SO
# -------------------------------
# visitdubai.com/en/whats-on returns 403 to any non-browser client — checked on
# 2026-09-07 and recorded in docs/datasets.md — and there is no public,
# machine-readable Dubai events feed with a licence that permits redistribution.
# So this file is what the master plan named as the fallback: a curated set
# built by hand from public listings, labelled `curated` on every row that
# reaches the database.
#
# WHAT IS AND IS NOT KNOWN, PER ROW
# ---------------------------------
# Each entry describes an event SERIES, not a single occurrence. The series is
# real, its venue and coordinates are real, and its established calendar window
# is real. The pipeline expands a series into dated instances across the loaded
# range, and every generated instance carries:
#
#   date_confidence: annual_window   the series runs in this window every year;
#                                    the exact dates of a given edition were not
#                                    confirmed against an official announcement.
#
# Nothing here claims a verified date. That distinction is carried into the
# database, exposed by the API and shown in the Data tab, because a forecast
# feature built on a date nobody checked should be visible as such.
#
# `scale` drives the demand feature. It is an ordinal judgement about footfall
# pull, not an attendance figure — an attendance number would imply a source
# that does not exist.

venues:
  dwtc:        {name: "Dubai World Trade Centre",        lat: 25.2255, lon: 55.2870}
  arena:       {name: "Coca-Cola Arena, City Walk",      lat: 25.2076, lon: 55.2617}
  opera:       {name: "Dubai Opera, Downtown",           lat: 25.1936, lon: 55.2740}
  meydan:      {name: "Meydan Racecourse",               lat: 25.1560, lon: 55.3020}
  globalvill:  {name: "Global Village",                  lat: 25.0700, lon: 55.3080}
  expocity:    {name: "Expo City Dubai",                 lat: 24.9600, lon: 55.1500}
  madinat:     {name: "Madinat Jumeirah",                lat: 25.1330, lon: 55.1840}
  festcity:    {name: "Dubai Festival City",             lat: 25.2210, lon: 55.3530}
  marina:      {name: "Dubai Marina and JBR",            lat: 25.0790, lon: 55.1350}
  burjpark:    {name: "Burj Park and Dubai Mall",        lat: 25.1972, lon: 55.2744}
  golfclub:    {name: "Emirates Golf Club",              lat: 25.0570, lon: 55.1650}
  tennis:      {name: "Dubai Duty Free Tennis Stadium",  lat: 25.2430, lon: 55.3400}
  sevens:      {name: "The Sevens Stadium",              lat: 24.9260, lon: 55.4130}
  d3:          {name: "Dubai Design District",           lat: 25.1860, lon: 55.2960}
  alserkal:    {name: "Alserkal Avenue, Al Quoz",        lat: 25.1400, lon: 55.2280}
  zabeel:      {name: "Zabeel Park",                     lat: 25.2320, lon: 55.3040}
  alseef:      {name: "Al Seef, Dubai Creek",            lat: 25.2620, lon: 55.2960}
  jumeirah:    {name: "Jumeirah Public Beach",           lat: 25.2050, lon: 55.2440}
  hattaa:      {name: "Hatta",                           lat: 24.7980, lon: 56.1180}
  dubaiinternet: {name: "Dubai Internet City",          lat: 25.0950, lon: 55.1620}
  citywide:    {name: "Citywide",                        lat: 25.2048, lon: 55.2708}

