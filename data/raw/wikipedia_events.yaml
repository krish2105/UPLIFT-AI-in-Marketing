Dubai Tennis Championships:
  extract: The Dubai Tennis Championships, also known as the Dubai Duty Free Tennis
    Championships for sponsorship reasons is a professional tennis tournament owned
    and organized by Dubai Duty Free and held annually in Dubai, United Arab Emirates
    on outdoor hardcourts. It is currently listed as a WTA 1000 on the WTA Tour and
    an ATP 500 on the ATP Tour.
  title: Dubai Tennis Championships
  url: https://en.wikipedia.org/wiki/Dubai_Tennis_Championships
Dubai World Cup:
  extract: The Dubai World Cup is a Thoroughbred horse race held annually since 1996
    and contested at the Meydan Racecourse in Dubai, United Arab Emirates. The race
    is operated by Emirates Racing Authority (ERA) and carries a purse of US$12 million.
  title: Dubai World Cup
  url: https://en.wikipedia.org/wiki/Dubai_World_Cup
GITEX:
  extract: GITEX GLOBAL or GITEX is a computer expo held annually in Dubai, United
    Arab Emirates at Dubai World Trade Center. It is the MENA region's largest tech
    expo and the third largest ICT expo in the world.
  title: GITEX
  url: https://en.wikipedia.org/wiki/GITEX
Global Village (Dubai):
  extract: Global Village is a cultural destination in the city of Dubai. It has different
    pavilions to showcase the culture and traditions of each country across the Globe.
    It is also a festive carnival where different restaurants and places are located
    too. Global Village is a place where people can look at the culture of different
    countries and regions.
  title: Global Village (Dubai)
  url: https://en.wikipedia.org/wiki/Global_Village_(Dubai)
