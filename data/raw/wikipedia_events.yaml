Arabian Travel Market:
  extract: Arabian Travel Market, known as ATM, is a travel and tourism event, organized
    annually in Dubai to provide a platform for inbound and outbound tourism professionals
    in the Middle East and gives information on tourism destinations, accommodation
    options, tourism attractions and aviation industry in the Middle East and around
    the world. The event is organized by RELX.
  title: Arabian Travel Market
  url: https://en.wikipedia.org/wiki/Arabian_Travel_Market
Art Dubai:
  extract: Art Dubai is an international art fair that takes place every March in
    Dubai. Founded in 2007, Art Dubai is a major platform for art from the Middle
    East, North Africa and South Asia.
  title: Art Dubai
  url: https://en.wikipedia.org/wiki/Art_Dubai
Dubai Desert Classic:
  extract: The Dubai Desert Classic is a European Tour golf tournament held on the
    Majlis course at Emirates Golf Club in Dubai, United Arab Emirates. In 1999 and
    2000 it was held at Dubai Creek Golf & Yacht Club.
  title: Dubai Desert Classic
  url: https://en.wikipedia.org/wiki/Dubai_Desert_Classic
