Dubai Marathon:
  extract: The Dubai Marathon is an annual road-based marathon hosted by the emirate
    of Dubai, United Arab Emirates, since 1998. The marathon is categorized as a Gold
    Label Road Race by World Athletics.
  title: Dubai Marathon
  url: https://en.wikipedia.org/wiki/Dubai_Marathon
