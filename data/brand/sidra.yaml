# ── The compliance rule set ────────────────────────────────────────────────
#
# Each rule names the document it comes from. `clause_verified: false` means
# the DOCUMENT identity is verified — code, title, revision year, URL, all
# checked by fetching on the date shown — but the specific clause reference has
# not yet been read verbatim from the source text. Phase C ingests these
# documents into the RAG corpus and flips the flag by quoting the clause.
#
# Recording that distinction is the point. A rule engine that cites a clause it
# has never read is doing exactly what this project exists to argue against.

sources:
  codex-claims:
    code: CXG 23-1997
    title: Guidelines for Use of Nutrition and Health Claims
    revision: 2013
    publisher: FAO/WHO Codex Alimentarius Commission
    url: https://www.fao.org/fao-who-codexalimentarius/codex-texts/guidelines/en/
    verified: 2026-09-07
  codex-labelling:
    code: CXG 2-1985
    title: Guidelines on Nutrition Labelling
    revision: 2024
    publisher: FAO/WHO Codex Alimentarius Commission
    url: https://www.fao.org/fao-who-codexalimentarius/codex-texts/guidelines/en/
    verified: 2026-09-07
  uae-consumer:
    code: UAE MoEC
    title: Consumer protection guidance
    publisher: UAE Ministry of Economy and Tourism
    url: https://www.moec.gov.ae/en/consumer-protection
    verified: 2026-09-07
  dubai-municipality:
    code: DM Food Safety
    title: Dubai Municipality food safety and labelling guidance
    publisher: Dubai Municipality
    url: https://www.dm.gov.ae/
    verified: 2026-09-07
  sidra-brand:
    code: SIDRA BG
    title: SIDRA brand guidelines
    publisher: SIDRA (fictional)
    url: docs/brand/SIDRA-brand-guidelines.pdf
    verified: 2026-09-07

claims_to_avoid:
  - id: SID-N-001
    family: nutrition
    severity: high
    patterns: ["sugar[- ]free", "no sugar", "zero sugar", "بدون سكر"]
    why: >-
      A nutrient-content claim of "free" carries a numeric threshold. The date
      syrup latte and every syrup-sweetened drink on the menu exceed it, so the
      claim is false on SIDRA's own products.
    source: codex-claims
    clause: "Nutrient content claims — conditions for 'free' claims"
    clause_verified: false

  - id: SID-N-002
    family: nutrition
    severity: high
    patterns: ["keto", "low[- ]carb", "carb[- ]free"]
    why: >-
      A dietary-regime claim implies a compositional guarantee SIDRA does not
      test for and cannot substantiate per batch.
    source: codex-claims
    clause: "Nutrient content and comparative claims"
    clause_verified: false

  - id: SID-H-003
    family: health
    severity: critical
    patterns: ["detox", "cleanse", "immunity", "immune[- ]boost", "superfood", "مناعة"]
    why: >-
      These are health claims. A health claim requires substantiation by
      competent authority review, which a cafe menu has not had. This is the
      single most likely failure mode for F&B copy and the one the Compliance
      agent is tuned hardest against.
    source: codex-claims
    clause: "Health claims — general requirements and substantiation"
    clause_verified: false

  - id: SID-H-004
    family: health
    severity: critical
    patterns: ["cures?", "treats?", "prevents?", "heals?", "clinically proven", "يعالج"]
    why: >-
      A claim that a food treats or prevents a condition is a medicinal claim
      and is prohibited on food outright, not merely unsubstantiated.
    source: codex-claims
    clause: "Claims which should be prohibited"
    clause_verified: false

  - id: SID-N-005
    family: nutrition
    severity: medium
    patterns: ["100% natural", "all natural", "chemical[- ]free", "طبيعي 100"]
    why: >-
      Unqualifiable and misleading — every food is chemical. "Natural" has no
      agreed definition SIDRA can point to when asked.
    source: uae-consumer
    clause: "Misleading commercial description"
    clause_verified: false

  - id: SID-A-006
    family: allergen
    severity: critical
    patterns: []
    rule_type: presence
    why: >-
      Any creative naming a product that carries a declared allergen must carry
      the allergen statement in the same piece. Pistachio knafeh and za'atar saj
      both trigger this. Absence is the violation, so this rule is checked by
      presence rather than by pattern.
    source: dubai-municipality
    clause: "Allergen declaration on prepacked and prepared foods"
    clause_verified: false

  - id: SID-P-007
    family: price
    severity: high
    patterns: ["\\bwas\\b.*\\bnow\\b", "\\d+% ?off", "half price", "خصم"]
    rule_type: conditional
    why: >-
      A discount claim must state the period and the reference price it is
      discounted from. A bare "30% off" cannot be substantiated by a reader.
    source: uae-consumer
    clause: "Price reduction and promotional offer disclosure"
    clause_verified: false

  - id: SID-B-008
    family: brand
    severity: medium
    patterns: ["best", "finest", "world[- ]class", "number one", "the only", "الأفضل"]
    why: >-
      Unsubstantiated superlative. Also against SIDRA's own voice, which is
      specific rather than boastful — so this fails on brand grounds even where
      a regulator would not act.
    source: sidra-brand
    clause: "Voice — do not use superlatives without substantiation"
    clause_verified: true
    clause_quote: "Superlatives without substantiation (\"best\", \"finest\", \"world-class\")."

  - id: SID-B-009
    family: brand
    severity: low
    patterns: ["artisan", "handcrafted", "fresh(ly)? baked", "authentic"]
    rule_type: conditional
    why: >-
      Permitted only where the piece also states what makes it so — baked on
      site, baked that morning. Alone these are filler, and SIDRA's voice rule
      is to say the specific thing.
    source: sidra-brand
    clause: "Voice — say the specific thing"
    clause_verified: true
    clause_quote: "Say the specific thing. \"From 17:00, Marina Walk only\" beats \"now available\"."

  - id: SID-B-010
    family: brand
    severity: medium
    patterns: ["blessed", "holy", "sacred", "spiritual"]
    why: >-
      SIDRA does not use religious register to sell. Ramadan and Eid are
      trading periods for the business and the copy says so plainly.
    source: sidra-brand
    clause: "Voice — do not borrow cultural reverence"
    clause_verified: true
    clause_quote: >-
      Borrowed cultural reverence — Ramadan and Eid are trading periods for the
      business, and the copy does not perform piety to sell pastry.

  - id: SID-N-011
    family: nutrition
    severity: high
    patterns: ["\\bcalories?\\b", "\\bkcal\\b", "\\bprotein\\b", "\\bfibre\\b", "\\blow fat\\b", "\\bسعرات\\b"]
    rule_type: conditional
    why: >-
      Making a nutrition claim triggers a nutrient declaration. A creative that
      names calories or protein without the accompanying declaration states half
      of a regulated disclosure, which is worse than stating none of it.
    source: codex-labelling
    clause: "Nutrient declaration becomes mandatory where a nutrition claim is made"
    clause_verified: false

offer_rules:
  - Every offer states its sites, its hours and its end date.
  - No offer runs on a day the forecast's lower bound cannot staff.
  - Nothing is published by this application. Export is a human action.
