# SIDRA — the brand this application plans for.
#
# SIDRA IS FICTIONAL. It is not a real company and no claim here describes any
# real business. It exists so that a forecast, a promotion, a creative and a
# compliance verdict can all refer to the same thing across the application,
# which a generic "Brand A" cannot do.
#
# This file is the SINGLE SOURCE OF TRUTH. The brand-guideline PDF is generated
# from it, the Creative agent composes from it, and the Compliance agent
# enforces `claims_to_avoid` out of it. Nothing downstream hardcodes a brand
# fact, so the PDF a reviewer reads and the rules the agent applies cannot
# drift apart.

meta:
  fictional: true
  disclaimer: >-
    SIDRA is a fictional Dubai speciality coffee and bakery chain, invented for
    the AI 208 coursework demonstration. It is not a real company. Footfall and
    point-of-sale figures shown against it are simulated, and are labelled as
    such wherever they appear.
  created: 2026-09-07
  owner: Krishna Mathur
  course: AI 208 AI in Marketing, SP Jain MAIB Term 4

identity:
  name: SIDRA
  name_ar: سدرة
  name_hi: सिदरा
  # Sidra is the Arabic name for the Ziziphus tree, which fruits in heat and
  # holds its leaves through the dry season. It is a reasonable name for a
  # cafe that trades hardest when the weather is worst.
  etymology: >-
    Arabic for the Ziziphus (sidr) tree, which fruits in heat and keeps its
    leaves through the dry season.
  founded: 2019
  category: Speciality coffee and bakery
  positioning: >-
    A neighbourhood speciality coffee and bakery for Dubai's second peak — the
    hours after work, when the heat drops and the city comes back outside.
  proposition: >-
    Coffee roasted for iced service, and a bakery counter built around dates,
    cardamom and pistachio rather than around European patisserie.
  founder_story: >-
    Opened as a single counter in Deira in 2019 serving the early market trade,
    and grew toward the evening as it moved west across the city.

zones:
  - code: DXB-DTN
    name: Downtown
    name_ar: وسط المدينة
    site: Dubai Mall district
    lat: 25.1972
    lon: 55.2744
    seats: 54
    outdoor_seats: 0
    opens: "07:00"
    closes: "23:30"
    character: Tourist-heavy, event-elastic, flat across the week
    demand_notes: >-
      Responds to events at Burj Park and the Dubai Opera district within 2 km.
      Least weekly seasonality of the four because its customers are not on a
      local working week.

  - code: DXB-MOE
    name: Al Barsha
    name_ar: البرشاء
    site: Mall of the Emirates district
    lat: 25.1181
    lon: 55.2003
    seats: 68
    outdoor_seats: 0
    opens: "08:00"
    closes: "23:00"
    character: Resident family, indoor, weather-inelastic
    demand_notes: >-
      Fully enclosed and air-conditioned, so temperature moves it least of the
      four. This is the control site against which the others' weather
      elasticity is measured.

  - code: DXB-MAR
    name: Marina Walk
    name_ar: مرسى دبي
    site: Dubai Marina promenade
    lat: 25.0805
    lon: 55.1403
    seats: 40
    outdoor_seats: 46
    opens: "07:30"
    closes: "01:00"
    character: Expat evening, outdoor seating, strongly weather-elastic
    demand_notes: >-
      More than half its covers are outdoors, so its demand tracks apparent
      temperature after 17:00 more tightly than any other site. The steepest
      temperature coefficient in the estate, and the reason the forecast is
      built per zone rather than per brand.

  - code: DXB-DEI
    name: Deira
    name_ar: ديرة
    site: Al Rigga
    lat: 25.2653
    lon: 55.3218
    seats: 32
    outdoor_seats: 12
    opens: "06:00"
    closes: "22:00"
    character: Value segment, early peak, Ramadan-heavy
    demand_notes: >-
      The original site and the earliest opening. Peaks before 09:00 on the
      market trade, and reshapes hardest through Ramadan — daytime trade
      collapses and the hours after iftar carry the day.

voice:
  principles:
    - Say the specific thing. "From 17:00, Marina Walk only" beats "now available".
    - Name the product, not the feeling. Cardamom cold brew, not "an experience".
    - One claim per piece. A creative that says three things says none.
    - Write in sentence case. SIDRA is not shouted.
    - Arabic is written, not translated. The AR variant is composed in Arabic,
      not run through a translator from the English.
  do:
    - Use exact times, exact sites, exact prices.
    - Say what is in the cup and what it costs.
    - Let a limited offer be visibly limited — dates, hours, sites.
  dont:
    - Superlatives without substantiation ("best", "finest", "world-class").
    - Health, nutrition or wellness framing of any kind. See claims_to_avoid.
    - Urgency manufactured by scarcity language that is not true.
    - Borrowed cultural reverence — Ramadan and Eid are trading periods for the
      business, and the copy does not perform piety to sell pastry.

# SIDRA's own palette, which is NOT the application's interface palette. The
# Creative agent composes ads in these; the interface is styled in
# apps/web/styles/tokens.css. Keeping them separate is what lets the app render
# an off-brand creative and have that be visible.
palette:
  ink:       "#1C1714"   # roasted, near-black with a red cast
  date:      "#6B3F28"   # the primary — date syrup
  cardamom:  "#5F7A63"   # the secondary — green cardamom pod
  saffron:   "#D9963A"   # the accent, used once per piece
  semolina:  "#F2E8D8"   # the ground
  paper:     "#FBF7F0"
  rules:
    - Saffron appears once per creative and never as a background.
    - Date and semolina carry every piece; cardamom is for secondary marks.
    - Never place ink type on date — it fails contrast. Use semolina.

typography:
  display: Marcellus
  body: Karla
  arabic: Noto Naskh Arabic
  devanagari: Noto Sans Devanagari
  rules:
    - Headlines set in Marcellus, sentence case, no tracking added.
    - Body never below 14px in a 1080px creative.
    - Arabic is set in Noto Naskh at 1.08x the Latin size for optical parity.

