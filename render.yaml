# MAWSIM's API on Render's free instance type.
#
# WHY THE DATABASE IS BUILT AT DEPLOY TIME AND NOT ATTACHED
# ---------------------------------------------------------
# Render's free web services cannot attach a persistent disk — disks are a
# paid-instance feature — and free Render Postgres expires 30 days after
# creation. Both checked against Render's own documentation on 2026-09-07.
#
# That is fine here, because this application's database is a CACHE of the
# pipelines rather than a system of record. Nothing a visitor does writes to it:
# the API is read-only, and every row comes from a pipeline run. So the build
# step runs the pipelines and bakes the database into the deployed filesystem.
#
# UPLIFT_DB MUST BE A REPO-RELATIVE PATH, NOT /tmp.
# The first deploy set it to /tmp/mawsim-ephemeral.db and came up with every
# dataset empty. Render's build and its runtime are DIFFERENT CONTAINERS: what
# the build writes to /tmp is gone by the time the service starts, while the
# build's working directory is carried forward as the runtime filesystem. So
# the database is written inside the project. /healthz caught this immediately
# by reporting "degraded" and naming the empty datasets, which is the entire
# reason it reports what is loaded rather than only that the process is up.
#
# The cost is build time — the weather ETL fetches 24 months of hourly history —
# and it is paid once per deploy rather than once per request.
#
# WHAT THE VISITOR SEES
# ---------------------
# The first request after 15 minutes idle takes roughly a minute while the
# instance wakes. The README says so rather than letting it read as a broken
# link.
services:
  - type: web
    name: mawsim-api
    runtime: python
    plan: free
    region: singapore            # closest region to the UAE audience for this work
    buildCommand: |
      pip install uv
      uv sync --frozen
      uv run python -m pipeline.weather
      uv run python -m pipeline.calendar
      uv run python -m pipeline.events
      uv run python -m pipeline.footfall
    startCommand: uv run uvicorn services.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # Repo-relative on purpose. See the header: /tmp does not survive from
      # the build container to the runtime one, and the service comes up empty.
      - key: UPLIFT_DB
        value: data/processed/uplift.db
      # Ollama does not exist here. Phase C's provider chain resolves to Gemini,
      # then Groq, then the deterministic stub. Without a key it runs on the
      # stub, which is a supported state and /healthz says so.
      - key: OLLAMA_HOST
        value: http://127.0.0.1:1
      - key: GEMINI_API_KEY
        sync: false              # set in the Render dashboard; never committed
      - key: GROQ_API_KEY
        sync: false
      # Present and unused. services/api/core/llm.py refuses to select Anthropic
      # even when this is set, and a test asserts the refusal.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The Vercel origins. Set here rather than left to the dashboard because
      # the web app fetches from the BROWSER — the station strip most visibly —
      # so a mismatch renders the app's honest "API unreachable" state, which
      # reads as a design decision rather than as a misconfiguration. The live
      # smoke test checks for exactly that string for the same reason.
      # The Admin capability. Absent unless this is set, and set in the dashboard
      # rather than here — a value in the repo is a value in every clone. With
      # no secret there is no Admin at all, which is the correct default for a
      # public URL: the capability is missing rather than open, and /admin/roles
      # says which. See docs/deploy.md to enable it.
      - key: UPLIFT_SIGNING_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://uplift-mawsim.vercel.app,https://uplift-mawsim-krishnamathur008-1499s-projects.vercel.app,https://uplift-mawsim-git-main-krishnamathur008-1499s-projects.vercel.app
      # Requests, not tokens. Free tiers do not return trustworthy token
      # accounting, and a number the project cannot verify has no business in a
      # report.
      - key: QUOTA_GEMINI_REQUESTS
        value: "200"
      - key: QUOTA_GROQ_REQUESTS
        value: "200"
